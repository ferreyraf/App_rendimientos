name: Instaladores V2 (Windows + Linux)

# Compila la app de escritorio de V2/ y genera los instaladores:
#  - Windows: RuloFinanciero-<versión>-Setup.exe (Inno Setup)
#  - Linux:   RuloFinanciero-<versión>-x86_64.AppImage
# A mano desde la pestaña Actions, o al pushear un tag v2.* (ej. v2.0.0), que
# además publica una Release de GitHub con los instaladores.

on:
  workflow_dispatch:
  push:
    tags:
      - "v2.*"

defaults:
  run:
    working-directory: V2

env:
  # Python en Windows escribe la consola en cp1252 si no se le indica UTF-8.
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar e instalador
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: V2/dist/release/*.exe
          if-no-files-found: error

  linux:
    # Ubuntu 22.04 (glibc 2.35): el AppImage corre en distros de esa edad en adelante.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerías del sistema para Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2 libdbus-1-3 libfontconfig1

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compilar y AppImage
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-linux
          path: |
            V2/dist/release/*.AppImage
            V2/dist/release/*.sh
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Rulo Financiero ${{ github.ref_name }}
          files: instaladores/*
          generate_release_notes: true
